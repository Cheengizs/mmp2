name: CI Code Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-check:
    name: Backend Syntax & Integrity Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BookLiba/src/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: BookLiba/src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run syntax verification
        run: npm test

  frontend-check:
    name: Frontend TypeScript & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BookLiba/src/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: BookLiba/src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Compile TypeScript & Build
        run: npm run build
