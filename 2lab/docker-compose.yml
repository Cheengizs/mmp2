services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: book_catalog_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-book_catalog}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-book_catalog}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Microsoft Azurite Emulator for Azure Blob Storage
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: book_catalog_azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --loose
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

  # 3. Node.js Express REST API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: book_catalog_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-book_catalog}
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      AZURE_CONTAINER_NAME: book-covers
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started

  # 4. React SPA Client (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: book_catalog_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  azurite_data:
